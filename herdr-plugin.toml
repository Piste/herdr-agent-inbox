# herdr-plugin.toml — manifest for herdr-agent-inbox.
#
# Inbox-style agent sidebar: live session titles, durable archive/snooze/revive,
# per-agent running time, and per-workspace agent rollups. A stdlib-Python daemon watches the
# herdr socket API and reports pane/workspace metadata + an agent view sort.

id = "herdr-agent-inbox"
name = "herdr-agent-inbox"
version = "0.3.1"
description = "Inbox for live agents with safe archive, snooze, search, and revive."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

# Start the daemon once the session is up; it flock-guards against duplicates.
[[startup]]
command = ["/bin/sh", "scripts/ensure-daemon.sh"]

# Cheap watchdog: if the daemon died, any newly detected agent revives it.
[[events]]
on = "pane.agent_detected"
command = ["/bin/sh", "scripts/ensure-daemon.sh"]

[[actions]]
id = "archive"
title = "Archive agent"
description = "Durably save and close the focused idle/done agent; revive it from Agent Inbox."
command = ["python3", "actions.py", "archive"]

[[actions]]
id = "unread"
title = "Mark agent unread"
description = "Return the focused live agent to the attention tier."
command = ["python3", "actions.py", "unread"]

[[actions]]
id = "retitle"
title = "Regenerate session title"
description = "Re-derive the focused agent's session title from its transcript."
command = ["python3", "actions.py", "retitle"]

[[actions]]
id = "sidebar-grow"
title = "Sidebar wider"
description = "Grow the sidebar by 2 columns (rewrites ui.sidebar_width + reload-config)."
command = ["python3", "actions.py", "sidebar", "+2"]

[[actions]]
id = "sidebar-shrink"
title = "Sidebar narrower"
description = "Shrink the sidebar by 2 columns (rewrites ui.sidebar_width + reload-config)."
command = ["python3", "actions.py", "sidebar", "-2"]

[[actions]]
id = "restart-daemon"
title = "Restart inbox daemon"
description = "Kill and restart the agent-inbox daemon."
command = ["/bin/sh", "scripts/restart-daemon.sh"]

[[panes]]
id = "inbox"
title = "Agent Inbox"
placement = "popup"
width = "80%"
height = "70%"
command = ["python3", "inbox_tui.py"]
